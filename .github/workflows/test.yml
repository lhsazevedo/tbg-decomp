name: Test

on: ['push', 'pull_request']

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DC_SDK: sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SDK_REPO_KEY }}
          repository: lhsazevedo/dc-sdk-155j
          path: sdk

      - name: Install tools
        run: |
          python3 scripts/install_tools.py wibo sh4objtest
          echo "$PWD/build/tools" >> "$GITHUB_PATH"

      - name: Test
        run: bash scripts/run_tests.sh --parallel

      - name: Check data section match
        run: bash scripts/check_data_match.sh

      - name: Lint
        run: bash scripts/lint.sh
