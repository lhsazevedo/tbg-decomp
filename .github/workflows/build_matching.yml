name: Build Matching

on: ['push', 'pull_request']

jobs:
  build:
    name: Build Matching
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SDK_REPO_KEY }}
          repository: lhsazevedo/dc-sdk-155j
          path: sdk

      - name: Install tools
        run: |
          python3 scripts/install_tools.py wibo
          echo "$PWD/build/tools" >> "$GITHUB_PATH"

      - name: Configure environment
        run: |
          # lnk rejects '-' in paths
          sudo ln -sfn "$PWD/sdk" /sdk
          echo "DC_SDK=/sdk" >> "$GITHUB_ENV"

      - name: Build
        run: python3 build.py matching
