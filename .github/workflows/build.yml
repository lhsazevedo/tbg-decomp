name: Build

on: ['push', 'pull_request']

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DC_SDK: sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SDK_REPO_KEY }}
          repository: lhsazevedo/dc-sdk-155j
          path: sdk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tools
        run: |
          python scripts/install_tools.py wibo
          echo "${{ github.workspace }}/build/tools" >> "$GITHUB_PATH"
        shell: bash

      - name: Build
        run: python build.py
