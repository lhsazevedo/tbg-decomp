<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TBG Reference Graph</title>
<style>
  :root {
    --bg: #14161c; --panel: #1d2029; --fg: #d7dae0; --muted: #8b909c;
    --code: #4c7fff; --data: #ffab3d; --asm: #6b7280; --c: #33c481;
    --edge: #3a3f4b; --border: #2a2e38;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; height: 100vh; }
  #side { width: 250px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
    padding: 14px 16px; overflow-y: auto; }
  #side h1 { font-size: 14px; margin: 0 0 4px; }
  #side .sub { color: var(--muted); font-size: 11px; margin-bottom: 14px; }
  .group { margin-bottom: 16px; }
  .group h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 0 0 8px; }
  label.row { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  label.row input { accent-color: var(--code); }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .line { width: 16px; height: 0; border-top-width: 3px; border-top-style: solid; flex: none; }
  #search { width: 100%; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--fg); }
  .stat { color: var(--muted); font-size: 11px; }
  #stage { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; }
  #tip { position: absolute; pointer-events: none; z-index: 10; max-width: 340px;
    background: #0c0d11ee; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 12px; display: none; }
  #tip .t { font-weight: 600; margin-bottom: 4px; }
  #tip .k { color: var(--muted); }
  #tip ul { margin: 4px 0 0; padding-left: 16px; max-height: 200px; overflow-y: auto; }
  #tip code { color: var(--fg); }
  .hint { color: var(--muted); font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>TBG Reference Graph</h1>
    <div class="sub" id="counts"></div>

    <div class="group">
      <h2>Search</h2>
      <input id="search" placeholder="filter units...">
    </div>

    <div class="group">
      <h2>Edges (by target)</h2>
      <label class="row"><input type="checkbox" id="e-code" checked>
        <span class="line" style="border-top-color: var(--code)"></span> code (calls)</label>
      <label class="row"><input type="checkbox" id="e-data" checked>
        <span class="line" style="border-top-color: var(--data)"></span> data (globals)</label>
    </div>

    <div class="group">
      <h2>Units</h2>
      <label class="row"><input type="checkbox" id="n-c" checked>
        <span class="swatch" style="background: var(--c)"></span> decompiled (C)</label>
      <label class="row"><input type="checkbox" id="n-asm" checked>
        <span class="swatch" style="background: var(--asm)"></span> not decompiled (asm)</label>
      <label class="row"><input type="checkbox" id="n-iso">
        <span class="swatch" style="background: transparent; border: 1px solid var(--muted)"></span> show isolated</label>
    </div>

    <div class="group">
      <h2>Clusters</h2>
      <label class="row"><input type="checkbox" id="n-hull" checked>
        <span class="swatch" style="background: linear-gradient(135deg,#e06c9f,#6ca8ff)"></span> cluster halos</label>
      <div class="hint" style="margin-top:6px">Colored ring = cluster (found by ignoring
        the top-degree hub units). Gray nodes with no ring are hubs/bridges.</div>
    </div>

    <div class="hint">Drag nodes. Scroll to zoom. Drag background to pan.
      Hover a node or edge for detail.</div>
  </div>

  <div id="stage">
    <canvas id="c"></canvas>
    <div id="tip"></div>
  </div>
</div>

<!-- GRAPH_DATA -->
<script>
(function () {
  if (typeof GRAPH === "undefined") { document.getElementById("counts").textContent =
    "No graph data injected."; return; }

  const COL = { code: "#4c7fff", data: "#ffab3d", asm: "#6b7280", c: "#33c481", edge: "#3a3f4b" };
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const stage = document.getElementById("stage");
  const tip = document.getElementById("tip");

  // --- model ---------------------------------------------------------------
  const nodes = GRAPH.nodes.map(n => Object.assign({}, n));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const edges = GRAPH.edges.filter(e => byId.has(e.source) && byId.has(e.target))
    .map(e => ({ ...e, s: byId.get(e.source), t: byId.get(e.target) }));

  // degree, for isolated-node filtering and sizing
  for (const n of nodes) n.deg = 0;
  for (const e of edges) { e.s.deg++; e.t.deg++; }

  // --- community detection --------------------------------------------------
  // This graph is hub-dominated: ~12 shared-service units (text, sectionB, tasks,
  // route_load, ...) link to nearly everything, so plain clustering collapses into
  // one blob. We treat the top-degree units as *bridges* (comm = null, they float
  // between clusters) and run weighted label propagation on the rest, then drop
  // clusters too small to be meaningful. This reveals the real sub-structure the
  // hubs otherwise mask.
  const HUB_COUNT = Math.max(8, Math.round(nodes.length * 0.15));
  const hubs = new Set([...nodes].sort((a, b) => b.deg - a.deg).slice(0, HUB_COUNT).map(n => n.id));
  for (const n of nodes) n.isHub = hubs.has(n.id);

  const adj = new Map(nodes.map(n => [n.id, []]));  // full graph, for hover/neighbor pull
  const subAdj = new Map(nodes.map(n => [n.id, []]));  // hub edges removed, for clustering
  for (const e of edges) {
    adj.get(e.source).push([e.target, e.count]);
    adj.get(e.target).push([e.source, e.count]);
    if (hubs.has(e.source) || hubs.has(e.target)) continue;
    subAdj.get(e.source).push([e.target, e.count]);
    subAdj.get(e.target).push([e.source, e.count]);
  }

  for (const n of nodes) n.comm = n.isHub ? null : n.id;
  for (let it = 0; it < 30; it++) {
    let changed = false;
    for (const n of [...nodes].sort(() => Math.random() - 0.5)) {
      if (n.isHub) continue;
      const tally = new Map();
      for (const [nb, c] of subAdj.get(n.id)) {
        const l = byId.get(nb).comm;
        if (l === null) continue;
        tally.set(l, (tally.get(l) || 0) + c);
      }
      if (!tally.size) continue;
      let best = n.comm, bestv = -1;
      for (const [l, v] of tally) if (v > bestv || (v === bestv && l < best)) { best = l; bestv = v; }
      if (best !== n.comm) { n.comm = best; changed = true; }
    }
    if (!changed) break;
  }
  // demote clusters smaller than 3 to floaters (comm = null)
  const size = {};
  for (const n of nodes) if (n.comm !== null) size[n.comm] = (size[n.comm] || 0) + 1;
  for (const n of nodes) if (n.comm !== null && size[n.comm] < 3) n.comm = null;

  const commList = [...new Set(nodes.filter(n => n.comm !== null).map(n => n.comm))];
  const PALETTE = ["#e06c9f", "#7bd88f", "#6ca8ff", "#e8c15a", "#c08bff",
                   "#4fd0d0", "#ff9d6c", "#9fb85a", "#f07070", "#6cb0e0"];
  const commColor = new Map(commList.map((c, i) => [c, PALETTE[i % PALETTE.length]]));

  document.getElementById("counts").textContent =
    `${nodes.length} units, ${edges.length} edges, ${commList.length} clusters, ` +
    `${Object.keys(GRAPH.sdkImports).length} SDK imports`;

  // initial layout: circle
  let W = stage.clientWidth, H = stage.clientHeight;
  // seed each cluster around its own anchor on a big ring, so the sim converges
  // into separated blobs instead of untangling from one shared circle
  const R = Math.min(W, H) * 0.40;
  const anchor = new Map(commList.map((c, i) => {
    const a = (i / commList.length) * Math.PI * 2;
    return [c, { x: Math.cos(a) * R, y: Math.sin(a) * R }];
  }));
  nodes.forEach((n) => {
    const a = n.comm !== null ? anchor.get(n.comm) : { x: 0, y: 0 };  // floaters start center
    n.x = a.x + (Math.random() - 0.5) * 60;
    n.y = a.y + (Math.random() - 0.5) * 60;
    n.vx = 0; n.vy = 0;
  });

  // --- view transform ------------------------------------------------------
  const view = { x: 0, y: 0, k: 1 };
  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();
  view.x = W / 2; view.y = H / 2;

  const toScreen = p => ({ x: p.x * view.k + view.x, y: p.y * view.k + view.y });
  const toWorld = (sx, sy) => ({ x: (sx - view.x) / view.k, y: (sy - view.y) / view.k });

  // --- filters -------------------------------------------------------------
  const flt = { code: true, data: true, c: true, asm: true, iso: false, hull: true, q: "" };
  function bind(id, key) {
    const el = document.getElementById(id);
    el.addEventListener("change", () => { flt[key] = el.checked; });
  }
  bind("e-code", "code"); bind("e-data", "data");
  bind("n-c", "c"); bind("n-asm", "asm"); bind("n-iso", "iso"); bind("n-hull", "hull");
  document.getElementById("search").addEventListener("input", e => {
    flt.q = e.target.value.trim().toLowerCase();
  });

  function edgeVisible(e) {
    if (!flt[e.kind]) return false;
    return nodeTypeVisible(e.s) && nodeTypeVisible(e.t);
  }
  function nodeTypeVisible(n) { return n.type === "c" ? flt.c : flt.asm; }
  function nodeVisible(n) {
    if (!nodeTypeVisible(n)) return false;
    if (!flt.iso && n.deg === 0) return false;
    return true;
  }
  function matches(n) { return flt.q && n.id.toLowerCase().includes(flt.q); }

  // --- force simulation ----------------------------------------------------
  // Cooling schedule: alpha decays monotonically toward 0 and the sim freezes at
  // alphaMin (no perpetual jitter). reheat() bumps it on drag / filter / resize.
  const REPULSION = 18000, REST = 110, STIFF = 0.05, GRAVITY = 0.008, CLUSTER = 0.1;
  const CROSS_BOOST = 3.5;  // extra repulsion between different clusters -> spreads groups apart
  const DECAY = 0.985, ALPHA_MIN = 0.004, DAMP = 0.8, MAX_STEP = 18;
  let alpha = 1;
  function reheat(v = 0.5) { alpha = Math.max(alpha, v); }

  function step() {
    if (alpha < ALPHA_MIN) return false;
    alpha *= DECAY;
    const k = alpha;
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy || 0.01;
        const d = Math.sqrt(d2);
        // different (non-null) clusters push harder apart, so groups separate
        // instead of just packing side by side at the same density as within a group
        const cross = (a.comm !== null && b.comm !== null && a.comm !== b.comm) ? CROSS_BOOST : 1;
        const f = (REPULSION * cross * k) / d2;
        const fx = (dx / d) * f, fy = (dy / d) * f;
        if (!a.fixed) { a.vx += fx; a.vy += fy; }
        if (!b.fixed) { b.vx -= fx; b.vy -= fy; }
      }
    }
    for (const e of edges) {
      let dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f = (d - REST) * STIFF * k;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      if (!e.s.fixed) { e.s.vx += fx; e.s.vy += fy; }
      if (!e.t.fixed) { e.t.vx -= fx; e.t.vy -= fy; }
    }
    // community cohesion: cluster members pull toward their cluster centroid;
    // hubs/floaters have no cluster, so they drift to the mean of their neighbors
    // (settling between the clusters they bridge).
    const cen = new Map();
    for (const n of nodes) {
      if (n.comm === null) continue;
      let c = cen.get(n.comm);
      if (!c) { c = { x: 0, y: 0, n: 0 }; cen.set(n.comm, c); }
      c.x += n.x; c.y += n.y; c.n++;
    }
    for (const c of cen.values()) { c.x /= c.n; c.y /= c.n; }
    for (const n of nodes) {
      if (n.fixed) continue;
      if (n.comm !== null) {
        const c = cen.get(n.comm);
        n.vx += (c.x - n.x) * CLUSTER * k;
        n.vy += (c.y - n.y) * CLUSTER * k;
      } else {
        const nb = adj.get(n.id);
        if (!nb.length) continue;
        let mx = 0, my = 0;
        for (const [id] of nb) { const p = byId.get(id); mx += p.x; my += p.y; }
        n.vx += (mx / nb.length - n.x) * CLUSTER * 0.5 * k;
        n.vy += (my / nb.length - n.y) * CLUSTER * 0.5 * k;
      }
    }
    for (const n of nodes) {
      if (n.fixed) continue;
      n.vx += -n.x * GRAVITY * k;
      n.vy += -n.y * GRAVITY * k;
      n.vx *= DAMP; n.vy *= DAMP;
      // clamp per-tick displacement so the layout never flings across the screen
      n.vx = Math.max(-MAX_STEP, Math.min(MAX_STEP, n.vx));
      n.vy = Math.max(-MAX_STEP, Math.min(MAX_STEP, n.vy));
      n.x += n.vx; n.y += n.vy;
    }
    return true;
  }

  // Pre-warm off-screen so the graph reveals already near-settled, not mid-explosion.
  for (let i = 0; i < 250 && step(); i++) { /* settle */ }
  alpha = 0.12;  // a short, calm final glide once visible

  function radius(n) { return 4 + Math.sqrt(n.deg) * 1.6; }
  function nodeColor(n) { return n.type === "c" ? COL.c : COL.asm; }

  let hoverNode = null, hoverEdge = null, drag = null, pan = null;

  // neighbours of the hovered node, for focus-dimming the rest
  let focus = null;
  function computeFocus() {
    if (!hoverNode) { focus = null; return; }
    focus = new Set([hoverNode.id]);
    for (const [id] of adj.get(hoverNode.id)) focus.add(id);
  }
  const dimmed = n => (focus && !focus.has(n.id)) || (flt.q && !matches(n));

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // cluster halos: a soft filled blob behind each community's members
    if (flt.hull) {
      for (const c of commList) {
        const mem = nodes.filter(n => n.comm === c && nodeVisible(n));
        if (mem.length < 3) continue;
        let cx = 0, cy = 0;
        for (const n of mem) { cx += n.x; cy += n.y; }
        cx /= mem.length; cy /= mem.length;
        let rad = 0;
        for (const n of mem) rad = Math.max(rad, Math.hypot(n.x - cx, n.y - cy));
        const p = toScreen({ x: cx, y: cy });
        ctx.beginPath();
        ctx.arc(p.x, p.y, (rad + 26) * view.k, 0, Math.PI * 2);
        ctx.fillStyle = commColor.get(c) + "1c";
        ctx.fill();
      }
    }

    // edges
    for (const e of edges) {
      if (!edgeVisible(e)) continue;
      const hot = e === hoverEdge || e.s === hoverNode || e.t === hoverNode;
      const faded = focus && !hot;
      const s = toScreen(e.s), t = toScreen(e.t);
      ctx.strokeStyle = COL[e.kind] + (hot ? "" : faded ? "18" : "55");
      ctx.lineWidth = hot ? 2 : Math.min(1 + e.count * 0.12, 3);
      ctx.beginPath();
      ctx.moveTo(s.x, s.y); ctx.lineTo(t.x, t.y);
      ctx.stroke();
    }

    // nodes
    for (const n of nodes) {
      if (!nodeVisible(n)) continue;
      const p = toScreen(n);
      const r = radius(n) * Math.min(view.k, 1.5);
      ctx.globalAlpha = dimmed(n) ? 0.12 : 1;
      // community ring (skip hubs/floaters)
      if (n.comm !== null) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 2.5, 0, Math.PI * 2);
        ctx.fillStyle = commColor.get(n.comm);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = nodeColor(n);
      ctx.fill();
      if (n === hoverNode || matches(n)) {
        ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // labels for hovered / matched / focused / large nodes when zoomed in
      const label = n === hoverNode || matches(n) || (focus && focus.has(n.id)) ||
        (!focus && view.k > 1.1 && n.deg > 3);
      if (label && !dimmed(n)) {
        ctx.fillStyle = "#d7dae0";
        ctx.font = "11px sans-serif";
        ctx.fillText(n.id, p.x + r + 3, p.y + 3);
      }
    }
  }

  function frame() { step(); draw(); requestAnimationFrame(frame); }
  frame();

  // --- interaction ---------------------------------------------------------
  function pick(sx, sy) {
    let best = null, bestD = 12;
    for (const n of nodes) {
      if (!nodeVisible(n)) continue;
      const p = toScreen(n);
      const d = Math.hypot(p.x - sx, p.y - sy);
      if (d < Math.max(radius(n) * view.k + 3, bestD)) { best = n; bestD = d; }
    }
    return best;
  }
  function pickEdge(sx, sy) {
    let best = null, bestD = 5;
    for (const e of edges) {
      if (!edgeVisible(e)) continue;
      const a = toScreen(e.s), b = toScreen(e.t);
      const d = distToSeg(sx, sy, a.x, a.y, b.x, b.y);
      if (d < bestD) { best = e; bestD = d; }
    }
    return best;
  }
  function distToSeg(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy || 1;
    let t = ((px - x1) * dx + (py - y1) * dy) / l2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  function relPos(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  canvas.addEventListener("mousedown", ev => {
    const p = relPos(ev);
    const n = pick(p.x, p.y);
    if (n) { drag = n; n.fixed = true; reheat(0.3); }
    else { pan = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y }; }
  });
  window.addEventListener("mousemove", ev => {
    const p = relPos(ev);
    if (drag) {
      const w = toWorld(p.x, p.y);
      drag.x = w.x; drag.y = w.y; drag.vx = drag.vy = 0;
      return;
    }
    if (pan) {
      view.x = pan.vx + (ev.clientX - pan.x);
      view.y = pan.vy + (ev.clientY - pan.y);
      return;
    }
    hoverNode = pick(p.x, p.y);
    hoverEdge = hoverNode ? null : pickEdge(p.x, p.y);
    computeFocus();
    updateTip(ev, p);
  });
  window.addEventListener("mouseup", () => {
    if (drag) drag.fixed = false;
    drag = null; pan = null;
  });
  canvas.addEventListener("wheel", ev => {
    ev.preventDefault();
    const p = relPos(ev);
    const w = toWorld(p.x, p.y);
    const f = Math.exp(-ev.deltaY * 0.0015);
    view.k = Math.max(0.2, Math.min(6, view.k * f));
    view.x = p.x - w.x * view.k;
    view.y = p.y - w.y * view.k;
  }, { passive: false });

  function updateTip(ev, p) {
    if (hoverNode) {
      const n = hoverNode;
      const outs = edges.filter(e => e.s === n && edgeVisible(e));
      const ins = edges.filter(e => e.t === n && edgeVisible(e));
      tip.innerHTML = `<div class="t">${n.id}</div>` +
        `<div class="k">${n.type === "c" ? "decompiled (C)" : "not decompiled (asm)"}` +
        ` &middot; ${n.nExports} exports` +
        `${n.hasCode ? " &middot; code" : ""}${n.hasData ? " &middot; data" : ""}</div>` +
        `<div class="k">out: ${outs.length} &nbsp; in: ${ins.length}</div>`;
    } else if (hoverEdge) {
      const e = hoverEdge;
      const syms = e.symbols.slice(0, 40).map(s => `<li><code>${s}</code></li>`).join("");
      const more = e.symbols.length > 40 ? `<li class="k">+${e.symbols.length - 40} more</li>` : "";
      tip.innerHTML = `<div class="t">${e.source} &rarr; ${e.target}</div>` +
        `<div class="k">${e.kind} reference &middot; ${e.count} reloc(s)</div>` +
        `<ul>${syms}${more}</ul>`;
    } else { tip.style.display = "none"; return; }
    tip.style.display = "block";
    const tr = tip.getBoundingClientRect();
    let x = p.x + 14, y = p.y + 14;
    if (x + tr.width > W) x = p.x - tr.width - 14;
    if (y + tr.height > H) y = Math.max(4, p.y - tr.height - 14);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
})();
</script>
</body>
</html>
